
name: Build Hoshino OS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract starter kit
        run: |
          unzip -o Hoshino_OS_Starter_Kit.zip -d starter
          find starter -maxdepth 3 -type f

      - name: Check build files
        run: |
          find starter -type f
          test -f starter/build.sh || test -f starter/Hoshino_OS_Starter_Kit/build.sh
          
